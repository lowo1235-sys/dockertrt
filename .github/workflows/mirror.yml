name: Mirror Triton to GHCR (skopeo streaming)

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --version

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Stream copy image (no local disk needed)
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          skopeo copy --retry-times 5 \
            docker://nvcr.io/nvidia/tritonserver:25.06-trtllm-python-py3 \
            docker://ghcr.io/$OWNER_LC/triton:25.06-trtllm-python-py3

      - name: Show pull command
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo ""
          echo "================================"
          echo "✅ Mirror complete!"
          echo "Pull command:"
          echo "  docker pull ghcr.io/$OWNER_LC/triton:25.06-trtllm-python-py3"
          echo "================================"
